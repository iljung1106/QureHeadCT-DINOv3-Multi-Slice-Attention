seed: 42
labels:
  - ICH
  - IPH
  - IVH
  - SDH
  - EDH
  - SAH
  - MidlineShift
  - MassEffect
paths:
  index_csv: data/processed/dicom_index_fast.csv
  labels_csv: data/processed/labels_matched.csv
  split_csv: splits/cq500_seed42.csv
  feature_dir: data/features/dinov3_vitb16
  output_dir: data/models/frozen_bigru_abmil
model:
  feature_dim: 768
  hidden_dim: 256
  gru_layers: 1
  dropout: 0.25
