[project]
name = "dinov3-ct-mil"
version = "0.1.0"
description = "DINOv3-BiGRU-GatedABMIL baseline for Head CT multiple instance learning."
requires-python = ">=3.10,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
